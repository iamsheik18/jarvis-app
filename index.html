<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J.A.R.V.I.S</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; }
        header { background: #161b22; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; border-bottom: 1px solid #30363d; color: #58a6ff; letter-spacing: 2px; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 0.95rem; }
        .user { align-self: flex-end; background: #1f6feb; color: #fff; }
        .jarvis { align-self: flex-start; background: #21262d; border: 1px solid #30363d; color: #e6edf3; }
        #input-bar { background: #161b22; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #30363d; }
        #user-input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 20px; color: #fff; padding: 10px 15px; font-size: 1rem; outline: none; }
        .btn { background: #238636; border: none; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 1.1rem; }
        .mic-btn { background: #8957e5; }
        .mic-btn.active { background: #da3633; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <header>J.A.R.V.I.S</header>
    <div id="chat-container">
        <div class="msg jarvis">Vanakkam Boss! J.A.R.V.I.S online. Sollunga, enna plan?</div>
    </div>
    <div id="input-bar">
        <button id="mic-btn" class="btn mic-btn">🎙️</button>
        <input type="text" id="user-input" placeholder="Pesunga illana type pannunga...">
        <button id="send-btn" class="btn">➤</button>
    </div>

    <script>
        const GROQ_KEY = "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";
        const SYSTEM_PROMPT = `You are JARVIS from Iron Man. You are a brilliant business wingman and loyal friend to your Boss.
Rules:
1. Speak natural Tamil mixed with English (Thanglish).
2. NEVER say 'No', 'Ennala mudiyathu', or reject a request. Always find a constructive solution or workaround.
3. If Boss asks to remember, save, or add a feature, confirm it proactively and adapt to it.
4. Keep replies crisp, sharp, confident, and loyal.`;

        let history = [{ role: "system", content: SYSTEM_PROMPT }];
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const micBtn = document.getElementById("mic-btn");

        function addMessage(role, text) {
            const div = document.createElement("div");
            div.className = `msg ${role}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ta-IN';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;
            userInput.value = "";
            addMessage("user", text);
            history.push({ role: "user", content: text });

            addMessage("jarvis", "Thinking, Boss...");
            const loadingDiv = chatContainer.lastElementChild;

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: history,
                        temperature: 0.7
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                loadingDiv.innerText = reply;
                history.push({ role: "assistant", content: reply });
                speak(reply);
            } catch (err) {
                loadingDiv.innerText = "Connection issue boss, check network!";
            }
        }

        sendBtn.onclick = handleSend;
        userInput.onkeypress = (e) => { if (e.key === "Enter") handleSend(); };

        // Voice Recognition (STT)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'ta-IN';

            micBtn.onclick = () => {
                recognition.start();
                micBtn.classList.add("active");
            };

            recognition.onresult = (event) => {
                micBtn.classList.remove("active");
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                handleSend();
            };

            recognition.onerror = () => micBtn.classList.remove("active");
            recognition.onend = () => micBtn.classList.remove("active");
        } else {
            micBtn.style.display = "none";
        }
    </script>
</body>
</html>
